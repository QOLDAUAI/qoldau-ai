<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Qolдау AI</title><style>body{font-family:system-ui,Arial;background:#f3f6fc;color:#17233d;margin:0}main{max-width:780px;margin:36px auto;padding:20px}.panel{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 35px #19355c12}h1{margin:0;color:#3d55bc}p{color:#52627a}label{display:block;margin-top:16px;font-weight:600}select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5e5;border-radius:10px;margin-top:6px}textarea{min-height:95px}button{margin-top:20px;background:#465bd2;color:white;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.55}#result{white-space:pre-wrap;line-height:1.7;background:#f0f4ff;padding:18px;border-radius:12px;margin-top:20px;display:none}.note{font-size:13px}</style></head><body><main><div class="panel"><h1>✦ Qolдау AI</h1><p>Әр балаға қолжетімді білім — барлық пәнге арналған оқу көмекшісі</p><label>Пән</label><select id="subject"><option>Математика</option><option>Қазақ тілі</option><option>Ағылшын тілі</option><option>Орыс тілі</option><option>Қазақстан тарихы</option><option>Дүниежүзі тарихы</option><option>География</option><option>Биология</option><option>Химия</option><option>Физика</option><option>Информатика</option><option>Әдебиет</option><option>Басқа пән</option></select><label>Сынып</label><select id="grade"><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option><option>11</option></select><label>Қолдау деңгейі</label><select id="level"><option>Өте жеңіл тілмен</option><option>Мысалмен түсіндіру</option><option>Қадам-қадаммен</option></select><label>Тапсырма немесе түсінбеген тақырып</label><textarea id="task" placeholder="Мысалы: Квадрат теңдеуді қалай шешемін?"></textarea><label>Менің жауабым (міндетті емес)</label><textarea id="answer" placeholder="Өз жауабыңды жазсаң, AI кері байланыс береді"></textarea><button id="go">✨ AI көмегін алу</button><div id="result" role="status" aria-live="polite"></div><p class="note">Жеке деректерді, оқушының аты-жөнін немесе фотосын енгізбеңіз. AI жауаптарын мұғалім тексеруі қажет.</p></div></main><script>document.getElementById('go').onclick=async()=>{const btn=document.getElementById('go'),out=document.getElementById('result');btn.disabled=true;out.style.display='block';out.textContent='AI тапсырманы талдап жатыр…';try{const data={};for(const id of ['subject','grade','level','task','answer'])data[id]=document.getElementById(id).value;const r=await fetch('/api/help',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();out.textContent=j.reply||j.error||'Белгісіз қате';}catch(e){out.textContent='Серверге қосылу мүмкін болмады: '+e.message}finally{btn.disabled=false}};</script></body></html>
